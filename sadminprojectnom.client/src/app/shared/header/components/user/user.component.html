<div class="user-wrapper">
  <div
    [matMenuTriggerFor]="userMenu"
    class="user-initial-circle"
  >
    {{ firstUserLetter() }}
  </div>

  <mat-menu #userMenu="matMenu" xPosition="before">
    <div class="user-menu-title" (click)="$event.stopPropagation()">
      <h4 class="user-menu-title__name">
        {{ user?.firstName }} {{ user?.lastName }}
      </h4>
      <span class="user-menu-title__link">{{ user?.email || 'Usuario' }}</span>
    </div>
    <button
      [routerLink]="routes.PROFILE"
      class="user-menu__item-title"
      mat-menu-item
    >
      <mat-icon class="user-menu-icon">account_circle</mat-icon>
      Perfil
    </button>

    <div class="theme-section" (click)="$event.stopPropagation()">
      <p class="menu-title">COLOR THEME</p>
      <div class="radio-group">
        <mat-radio-button
          color="primary"
          [checked]="isBlueTheme"
          (click)="changeThemeOnBlue()"
        ></mat-radio-button>
        <mat-radio-button
          color="warn"
          [checked]="isPinkTheme"
          (click)="changeThemeOnPink()"
        ></mat-radio-button>
        <mat-radio-button
          color="accent"
          [checked]="isGreenTheme"
          (click)="changeThemeOnGreen()"
        ></mat-radio-button>
      </div>

      <hr class="bord" />

      <p class="menu-title">DARK MODE</p>
      <div class="slide-wrapper">
        <mat-slide-toggle
          [checked]="isDarkMode"
          (change)="onDarkMode()"
          color="warn"
        ></mat-slide-toggle>
      </div>
    </div>

    <div class="sign-button-wrapper">
      <button (click)="signOutEmit()" class="sign-button" mat-flat-button>
        Cerrar sesión
      </button>
    </div>
  </mat-menu>

  <p class="greeting-text">
    Bienvenido, <span class="user-name">{{ user?.firstName }}</span>
  </p>
</div>
