<mat-card appearance="outlined" class="product-card">
  <div class="product-media">
    <img src="{{product.image}}" alt="{{product.title}}" class="product-img">
    <span
      class="product-status"
      [ngClass]="product.status === 'Sale' ? 'sale' : 'new'"
    >
      {{product.status}}
    </span>
  </div>

  <div class="product-title-wrapper">
    <p class="product-title">{{product.title}}</p>
  </div>

  <div class="product-price-wrapper">
    <p class="product-price">₡{{product.price | number}}</p>

    <button mat-raised-button color="primary" class="add-cart-btn" (click)="addToCart($event)">
      AGREGAR CARRITO
    </button>
  </div>
</mat-card>
